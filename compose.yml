# The whole stack, one file, laptop and VPS alike. Only .env differs between them.
#
#   laptop : APP_DOMAIN=localhost  CADDYFILE=Caddyfile.dev  PUBLIC_SCHEME=http   COOKIE_SECURE=false
#   VPS    : APP_DOMAIN=nextup.serviweb.ch  CADDYFILE=Caddyfile  PUBLIC_SCHEME=https  COOKIE_SECURE=true
#
# docs/INTEGRATIONS.md asks that only DATABASE_URL, N8N_BASE_URL and the domain differ between
# environments. That is what this is.
#
# NOTE: the file is named compose.yml, not docker-compose.override.yml - .gitignore swallows
# docker-compose.override.yml and *.local.yml, and .gitignore is not ours to edit.

name: nextup

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nextup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextup -d nextup"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot. `app` waits for this to finish, so a migration can never be forgotten on deploy.
  migrate:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://nextup:${POSTGRES_PASSWORD}@db:5432/nextup
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nextup:${POSTGRES_PASSWORD}@db:5432/nextup
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:?set ADMIN_ACCESS_CODE in .env}
      TENANT_MODE: ${TENANT_MODE:-subdomain}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # In-network only; n8n is never called over the internet.
      N8N_HOOK_URL: ${N8N_HOOK_URL:-http://n8n:5678/webhook/nextup/case-raised}
      N8N_HOOK_TOKEN: ${N8N_HOOK_TOKEN:-}
      # Sent with every notice, so n8n writes back to THIS app rather than to whichever address
      # it happens to have in its own environment. A server started outside this stack overrides
      # it - see .env.example.
      N8N_CALLBACK_BASE: ${N8N_CALLBACK_BASE:-http://app:3000}
      # "Send reply" on a pilot request in /admin. mailpit catches it; point at a real relay to deliver.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${APP_DOMAIN:-localhost}
      WEBHOOK_URL: ${PUBLIC_SCHEME:-http}://n8n.${APP_DOMAIN:-localhost}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TZ:-Europe/Zurich}
      N8N_DIAGNOSTICS_ENABLED: "false"
    # So a workflow can call back to an app running on the developer's machine rather than in
    # this stack - `next start` on the host is reachable at host.docker.internal, and without
    # this mapping that name does not resolve from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound to the loopback, not 0.0.0.0: this is so a dev server running on your own machine can
    # reach n8n (and so you can open the editor when Caddy is not in front of it), not so the
    # office network can. In production Caddy serves n8n.<domain> and this changes nothing.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./ops/n8n:/data/workflows:ro
    depends_on:
      app:
        condition: service_healthy

  # Catches every mail the demo sends, so nothing leaves the box and the team can watch one
  # inbox at mail.<domain> instead of configuring real SMTP for a pilot.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Loopback only, for the same reason as n8n: the runbook's "did the owner get the mail?" step
    # needs the inbox reachable without Caddy in front of it.
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - maildata:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  caddy:
    build:
      context: ops/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/${CADDYFILE:-Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      HOSTTECH_API_TOKEN: ${HOSTTECH_API_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
  n8ndata:
  maildata:
  caddydata:
  caddyconfig:
